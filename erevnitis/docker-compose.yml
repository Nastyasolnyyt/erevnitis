version: "3.9"

services:
  api:
    build: .
    container_name: erevnitis_api
    ports:
      - "8000:8000"
    volumes:
      - ./erevnitis.db:/app/erevnitis.db
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

