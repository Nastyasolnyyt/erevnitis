groups:
  - name: erevnitis
    rules:
      - alert: HighCPU
        expr: 100 - (avg by(job)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          description: "CPU > 80% на {{ $labels.job }}"

      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          description: "Сервер {{ $labels.job }} недоступен"

      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          description: "Диск заполнен на {{ printf \"%.0f\" $value }}% на {{ $labels.job }}"