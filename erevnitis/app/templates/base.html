<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Erevnitis SRE Panel{% endblock %}</title>

  <!-- Icons & Fonts (CDN) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Design System -->
  <link rel="stylesheet" href="/static/css/main.css">

  {% block extra_css %}{% endblock %}
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────────── -->
<header class="navbar">
  <a href="/" class="navbar-brand">
    <div class="brand-icon"><i class="bi bi-activity"></i></div>
    Erevnitis <span class="brand-accent">SRE</span>
  </a>

  <div class="navbar-spacer"></div>

  <div class="navbar-right">
    <a href="/docs" class="btn btn-ghost btn-sm" target="_blank" title="API Docs">
      <i class="bi bi-code-slash"></i> API
    </a>
    <div id="user-pill" class="user-pill"></div>
    <button class="btn btn-ghost btn-icon btn-sm" onclick="Auth.logout()" title="Выйти">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</header>

<div class="page-wrapper">

  <!-- ── Sidebar ────────────────────────────────────────────── -->
  <nav class="sidebar">
    <span class="sidebar-section">Мониторинг</span>

    <a href="/dashboard" class="sidebar-link">
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>
    <a href="/nodes" class="sidebar-link">
      <i class="bi bi-server"></i> Серверы
    </a>

    <span class="sidebar-section">Реагирование</span>

    <a href="/sla" class="sidebar-link">
      <i class="bi bi-shield-check"></i> SLA / Error Budget
    </a>
    <a href="/incidents" class="sidebar-link" id="incidents-link">
      <i class="bi bi-exclamation-triangle"></i> Инциденты
      <span class="sidebar-badge" id="sidebar-inc-count" style="display:none"></span>
    </a>

    <span class="sidebar-section">Система</span>

    <a href="/audit" class="sidebar-link role-admin">
      <i class="bi bi-journal-text"></i> Аудит
    </a>
    <a href="/users" class="sidebar-link role-admin">
      <i class="bi bi-people"></i> Пользователи
    </a>

    <div class="sidebar-footer">
      <a href="/docs" class="sidebar-link" target="_blank">
        <i class="bi bi-book"></i> Документация
      </a>
    </div>
  </nav>

  <!-- ── Page Content ───────────────────────────────────────── -->
  <main class="page-content">
    {% block content %}{% endblock %}
  </main>

</div>

<!-- ── Toast container (injected by JS) ────────────────────── -->

<!-- Scripts -->
<script src="/static/js/api.js"></script>
{% block scripts %}{% endblock %}

<script>
// Load open incident count for sidebar badge
(async () => {
  if (!Auth.isLoggedIn()) return;
  try {
    const stats = await api.incidents.stats();
    const count = (stats?.open || 0) + (stats?.investigating || 0);
    const badge = document.getElementById('sidebar-inc-count');
    if (badge && count > 0) {
      badge.textContent = count;
      badge.style.display = '';
    }
  } catch {}
})();
</script>

</body>
</html>
