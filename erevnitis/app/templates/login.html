<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Войти — Erevnitis SRE Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #e8f5e9 0%, #f0fdf4 40%, #f8fafc 100%);
      padding: 1rem;
    }

    .login-wrap {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(34,197,94,0.18);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(22,163,74,0.12);
      padding: 2.5rem;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      font-size: 1.625rem;
      color: white;
      box-shadow: 0 8px 24px rgba(22,163,74,0.3);
    }

    .login-brand h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #14532d;
      letter-spacing: -0.3px;
    }

    .login-brand p {
      color: #64748b;
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      border-radius: 10px;
      padding: 0.65rem 1rem;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1.25rem;
    }

    .pwd-wrap {
      position: relative;
    }

    .pwd-wrap .pwd-toggle {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px;
      font-size: 0.9rem;
    }

    .pwd-wrap .pwd-toggle:hover { color: #15803d; }

    .demo-section {
      margin-top: 1.5rem;
      border: 1px solid rgba(34,197,94,0.15);
      border-radius: 12px;
      overflow: hidden;
    }

    .demo-header {
      background: rgba(34,197,94,0.06);
      padding: 0.6rem 1rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #15803d;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .demo-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      border-top: 1px solid rgba(34,197,94,0.08);
    }

    .demo-row:first-of-type { border-top: none; }

    .demo-info {
      font-size: 0.8125rem;
      color: #475569;
    }

    .demo-info strong {
      color: #0f172a;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }

    .demo-role {
      font-size: 0.7rem;
      background: rgba(34,197,94,0.1);
      color: #15803d;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 600;
    }

    .btn-fill-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">

    <div class="login-brand">
      <div class="login-logo"><i class="bi bi-activity"></i></div>
      <h1>Erevnitis</h1>
      <p>SRE Infrastructure Panel</p>
    </div>

    <div class="alert-error" id="err-msg" style="display:none">
      <i class="bi bi-exclamation-circle-fill"></i>
      <span id="err-text"></span>
    </div>

    <div class="form-group">
      <label class="form-label">Логин</label>
      <input id="f-username" class="form-control" placeholder="admin"
             autocomplete="username" autofocus>
    </div>

    <div class="form-group">
      <label class="form-label">Пароль</label>
      <div class="pwd-wrap">
        <input id="f-password" class="form-control" type="password"
               placeholder="••••••••" autocomplete="current-password">
        <button class="pwd-toggle" type="button" onclick="togglePwd()" tabindex="-1">
          <i class="bi bi-eye" id="pwd-eye"></i>
        </button>
      </div>
    </div>

    <button class="btn btn-primary w-full" id="login-btn" onclick="doLogin()">
      <span id="btn-label"><i class="bi bi-lock-fill"></i> Войти в систему</span>
      <span id="btn-loading" style="display:none">
        <span class="spinner" style="border-color:rgba(255,255,255,.3);border-top-color:white"></span>
        Вход...
      </span>
    </button>

    <div class="demo-section" style="margin-top:1.5rem">
      <div class="demo-header">
        <i class="bi bi-info-circle"></i> Тестовые учётные данные
      </div>

      <div class="demo-row">
        <div class="demo-info">
          <strong>admin</strong> / admin123
        </div>
        <div class="flex gap-2 items-center">
          <span class="demo-role">admin</span>
          <button class="btn btn-outline btn-sm" onclick="fill('admin','admin123')">Войти</button>
        </div>
      </div>

      <div class="demo-row">
        <div class="demo-info">
          <strong>sre_ivanov</strong> / sre123
        </div>
        <div class="flex gap-2 items-center">
          <span class="demo-role">sre</span>
          <button class="btn btn-outline btn-sm" onclick="fill('sre_ivanov','sre123')">Войти</button>
        </div>
      </div>

      <div class="demo-row">
        <div class="demo-info">
          <strong>viewer_guest</strong> / view123
        </div>
        <div class="flex gap-2 items-center">
          <span class="demo-role">viewer</span>
          <button class="btn btn-outline btn-sm" onclick="fill('viewer_guest','view123')">Войти</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
if (Auth.isLoggedIn()) window.location.href = '/dashboard';

function fill(u, p) {
  document.getElementById('f-username').value = u;
  document.getElementById('f-password').value = p;
  doLogin();
}

function togglePwd() {
  const inp = document.getElementById('f-password');
  const eye = document.getElementById('pwd-eye');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  eye.className = inp.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
}

document.getElementById('f-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

async function doLogin() {
  const u = document.getElementById('f-username').value.trim();
  const p = document.getElementById('f-password').value;

  if (!u || !p) { showErr('Заполните логин и пароль'); return; }

  setLoading(true);
  hideErr();

  try {
    const data = await api.login(u, p);
    Auth.save(data.access_token, data.role, data.username);
    window.location.href = '/dashboard';
  } catch (e) {
    showErr(e.message);
  } finally {
    setLoading(false);
  }
}

function setLoading(on) {
  document.getElementById('btn-label').style.display  = on ? 'none' : '';
  document.getElementById('btn-loading').style.display = on ? '' : 'none';
  document.getElementById('login-btn').disabled = on;
}

function showErr(msg) {
  document.getElementById('err-text').textContent = msg;
  document.getElementById('err-msg').style.display = 'flex';
}

function hideErr() {
  document.getElementById('err-msg').style.display = 'none';
}
</script>
</body>
</html>
