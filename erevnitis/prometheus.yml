global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'ubuntu-185'
    static_configs:
      - targets: ['185.130.212.50:9100']
        labels:
          hostname: 'ubuntu-185'
          env: 'production'